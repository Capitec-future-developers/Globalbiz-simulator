name: Promote-Forward Deployment

run-name: Deploy ${{ github.base_ref }} from ${{ github.head_ref }} - ${{ github.actor }}

# ============================================================
# GLOBALBIZ SIMULATOR
#
# Promotion flow:
#
#   feature/release-* -> int
#   int -> uat
#   uat -> main
#
# Hotfix flow:
#
#   hotfix/release-* -> int
#   int -> uat
#   uat -> main
#   main -> uat -> int
#
# The project is a STATIC HTML/CSS/JavaScript application.
# No npm build is required.
# ============================================================

on:
  pull_request:
    branches:
      - int
      - uat
      - main
    types:
      - opened
      - synchronize
      - edited
      - reopened
      - closed

permissions:
  contents: read
  pull-requests: read

# ============================================================
# DETERMINE ENVIRONMENT
# ============================================================

jobs:

  determine-environment:

    if: >
      startsWith(github.head_ref, 'feature/release') ||
      startsWith(github.head_ref, 'promote/') ||
      startsWith(github.head_ref, 'hotfix/release') ||
      startsWith(github.head_ref, 'backport/') ||
      startsWith(github.head_ref, 'revert-')

    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.environment.outputs.environment }}
      next_environment: ${{ steps.environment.outputs.next_environment }}
      next_branch: ${{ steps.environment.outputs.next_branch }}

      should_validate: ${{ steps.environment.outputs.should_validate }}
      should_deploy: ${{ steps.environment.outputs.should_deploy }}

      should_create_promotion: ${{ steps.environment.outputs.should_create_promotion }}
      should_create_backport: ${{ steps.environment.outputs.should_create_backport }}

      backport_next_env: ${{ steps.environment.outputs.backport_next_env }}
      backport_next_branch: ${{ steps.environment.outputs.backport_next_branch }}

      is_hotfix: ${{ steps.environment.outputs.is_hotfix }}
      is_backport: ${{ steps.environment.outputs.is_backport }}

    steps:

      # ========================================================
      # VALIDATE BRANCH FLOW
      # ========================================================

      - name: Validate branch flow
        if: >
          github.event_name == 'pull_request' &&
          github.event.action != 'closed' &&
          startsWith(github.head_ref, 'feature/release')
        run: |

          HEAD_REF="${{ github.head_ref }}"
          BASE_REF="${{ github.base_ref }}"

          echo "========================================"
          echo "BRANCH VALIDATION"
          echo "========================================"
          echo "Source: $HEAD_REF"
          echo "Target: $BASE_REF"
          echo "========================================"

          if [[ "$BASE_REF" != "int" ]]; then

            echo ""
            echo "ERROR:"
            echo "feature/release-* branches must target int."
            echo ""
            echo "Expected:"
            echo "feature/release-* -> int -> uat -> main"
            echo ""

            exit 1

          fi

          echo "Branch validation passed."

      # ========================================================
      # DETERMINE ENVIRONMENT
      # ========================================================

      - name: Determine environment
        id: environment
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

        run: |

          TARGET_BRANCH="${{ github.base_ref }}"
          HEAD_REF="${{ github.head_ref }}"
          ACTION="${{ github.event.action }}"
          MERGED="${{ github.event.pull_request.merged }}"

          IS_HOTFIX="false"
          IS_BACKPORT="false"

          # ----------------------------------------------------
          # Detect flow type
          # ----------------------------------------------------

          if [[ "$HEAD_REF" == hotfix/release* ]]; then

            IS_HOTFIX="true"
            echo "Hotfix flow detected."

          elif [[ "$HEAD_REF" == backport/* ]]; then

            IS_BACKPORT="true"
            echo "Backport flow detected."

          elif [[ "$HEAD_REF" == feature/release* ]]; then

            echo "Feature release flow detected."

          elif [[ "$HEAD_REF" == promote/* ]]; then

            echo "Promotion flow detected."

          elif [[ "$HEAD_REF" == revert-* ]]; then

            echo "Revert flow detected."

          fi

          echo "is_hotfix=$IS_HOTFIX" >> "$GITHUB_OUTPUT"
          echo "is_backport=$IS_BACKPORT" >> "$GITHUB_OUTPUT"

          # ----------------------------------------------------
          # Default values
          # ----------------------------------------------------

          SHOULD_VALIDATE="false"
          SHOULD_DEPLOY="false"
          SHOULD_CREATE_PROMOTION="false"
          SHOULD_CREATE_BACKPORT="false"

          NEXT_ENVIRONMENT=""
          NEXT_BRANCH=""
          BACKPORT_NEXT_ENV=""
          BACKPORT_NEXT_BRANCH=""

          # ----------------------------------------------------
          # Pull request validation
          # ----------------------------------------------------

          if [[ "$ACTION" != "closed" ]]; then
            SHOULD_VALIDATE="true"
          fi

          # ----------------------------------------------------
          # Deployment only happens after merge
          # ----------------------------------------------------

          if [[ "$ACTION" == "closed" && "$MERGED" == "true" ]]; then
            SHOULD_DEPLOY="true"
          fi

          # ----------------------------------------------------
          # Environment mapping
          # ----------------------------------------------------

          case "$TARGET_BRANCH" in

            int)

              ENVIRONMENT="int"

              NEXT_ENVIRONMENT="uat"
              NEXT_BRANCH="uat"

              # Feature release into INT automatically
              # creates INT -> UAT promotion.

              if [[ "$IS_HOTFIX" == "false" &&
                    "$IS_BACKPORT" == "false" ]]; then

                SHOULD_CREATE_PROMOTION="true"

              fi

              # A hotfix entering INT does not automatically
              # create another promotion until the normal
              # hotfix flow reaches the next environment.

              ;;

            uat)

              ENVIRONMENT="uat"

              NEXT_ENVIRONMENT="prod"
              NEXT_BRANCH="main"

              # Only automatically promote normal promotion
              # branches from UAT to MAIN.

              if [[ "$HEAD_REF" == promote/* &&
                    "$IS_HOTFIX" == "false" &&
                    "$IS_BACKPORT" == "false" ]]; then

                SHOULD_CREATE_PROMOTION="true"

              fi

              # Backport from UAT -> INT

              if [[ "$IS_BACKPORT" == "true" ]]; then

                SHOULD_CREATE_BACKPORT="true"

                BACKPORT_NEXT_ENV="int"
                BACKPORT_NEXT_BRANCH="int"

              fi

              ;;

            main)

              ENVIRONMENT="prod"

              NEXT_ENVIRONMENT=""
              NEXT_BRANCH=""

              # Hotfix reaching production gets backported
              # to UAT.

              if [[ "$IS_HOTFIX" == "true" ]]; then

                SHOULD_CREATE_BACKPORT="true"

                BACKPORT_NEXT_ENV="uat"
                BACKPORT_NEXT_BRANCH="uat"

              fi

              ;;

            *)

              echo "ERROR: Unknown target branch:"
              echo "$TARGET_BRANCH"

              exit 1

              ;;

          esac

          # ----------------------------------------------------
          # Write outputs
          # ----------------------------------------------------

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

          echo "next_environment=$NEXT_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "next_branch=$NEXT_BRANCH" >> "$GITHUB_OUTPUT"

          echo "should_validate=$SHOULD_VALIDATE" >> "$GITHUB_OUTPUT"
          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"

          echo "should_create_promotion=$SHOULD_CREATE_PROMOTION" >> "$GITHUB_OUTPUT"
          echo "should_create_backport=$SHOULD_CREATE_BACKPORT" >> "$GITHUB_OUTPUT"

          echo "backport_next_env=$BACKPORT_NEXT_ENV" >> "$GITHUB_OUTPUT"
          echo "backport_next_branch=$BACKPORT_NEXT_BRANCH" >> "$GITHUB_OUTPUT"

          # ----------------------------------------------------
          # Summary
          # ----------------------------------------------------

          echo ""
          echo "========================================"
          echo "DEPLOYMENT DECISION"
          echo "========================================"
          echo "Source branch:       $HEAD_REF"
          echo "Target branch:       $TARGET_BRANCH"
          echo "Environment:         $ENVIRONMENT"
          echo "Merged:              $MERGED"
          echo "Validate:            $SHOULD_VALIDATE"
          echo "Deploy:              $SHOULD_DEPLOY"
          echo "Next environment:   $NEXT_ENVIRONMENT"
          echo "Next branch:        $NEXT_BRANCH"
          echo "Promotion PR:        $SHOULD_CREATE_PROMOTION"
          echo "Backport PR:         $SHOULD_CREATE_BACKPORT"
          echo "========================================"

  # ============================================================
  # VALIDATE OPEN PR
  # ============================================================

  validate-only:

    needs:
      - determine-environment

    if: >
      needs.determine-environment.outputs.should_validate == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Validate Globalbiz Simulator
        run: |

          echo "========================================"
          echo "GLOBALBIZ SIMULATOR VALIDATION"
          echo "========================================"

          echo "Environment: ${{ needs.determine-environment.outputs.environment }}"
          echo "Source:      ${{ github.head_ref }}"
          echo "Target:      ${{ github.base_ref }}"

          echo ""
          echo "Checking required project files..."

          test -f index.html || {
            echo "ERROR: index.html not found."
            exit 1
          }

          echo "index.html found."

          echo ""
          echo "Checking HTML structure..."

          grep -qi "<html" index.html || {
            echo "ERROR: index.html does not contain <html>."
            exit 1
          }

          grep -qi "<body" index.html || {
            echo "ERROR: index.html does not contain <body>."
            exit 1
          }

          echo "HTML validation passed."

          echo ""
          echo "Globalbiz Simulator validation passed."

  # ============================================================
  # DEPLOY TO GITHUB PAGES
  # ============================================================

  deploy:

    needs:
      - determine-environment

    if: >
      needs.determine-environment.outputs.should_deploy == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ========================================================
      # CHECKOUT MERGED TARGET BRANCH
      # ========================================================

      - name: Checkout merged branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      # ========================================================
      # PREPARE STATIC SITE
      # ========================================================

      - name: Prepare Globalbiz Simulator
        run: |

          echo "========================================"
          echo "PREPARING GLOBALBIZ SIMULATOR"
          echo "========================================"

          mkdir -p _site

          # Copy the actual static website to the Pages root.
          #
          # IMPORTANT:
          # We do NOT put the application inside
          # /int, /uat or /prod.
          #
          # This keeps the deployed URL:
          #
          # https://capitec-future-developers.github.io/Globalbiz-simulator/

          cp -r . _site/

          # Remove GitHub metadata.
          rm -rf _site/.git
          rm -rf _site/.github

          # Remove deployment directory if it somehow exists.
          rm -rf _site/_site

          echo ""
          echo "Environment deployed:"
          echo "${{ needs.determine-environment.outputs.environment }}"

          echo ""
          echo "Files being deployed:"

          find _site -maxdepth 2 -type f | sort | head -100

      # ========================================================
      # UPLOAD PAGES ARTIFACT
      # ========================================================

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # ========================================================
      # DEPLOY
      # ========================================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ========================================================
      # SMOKE TEST
      # ========================================================

      - name: Smoke test deployed site
        run: |

          URL="${{ steps.deployment.outputs.page_url }}"

          echo "========================================"
          echo "GITHUB PAGES SMOKE TEST"
          echo "========================================"

          echo "URL:"
          echo "$URL"

          sleep 15

          STATUS=$(curl \
            -L \
            -s \
            -o /tmp/body.html \
            -w "%{http_code}" \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "$URL" || echo "000")

          echo ""
          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then

            echo ""
            echo "ERROR: GitHub Pages returned HTTP $STATUS"

            exit 1

          fi

          if ! grep -qi "<html" /tmp/body.html; then

            echo ""
            echo "ERROR: Response does not contain HTML."

            exit 1

          fi

          echo ""
          echo "========================================"
          echo "SMOKE TEST PASSED"
          echo "========================================"

  # ============================================================
  # AUTOMATIC ROLLBACK
  # ============================================================

  rollback:

    needs:
      - determine-environment
      - deploy

    if: >
      failure() &&
      needs.deploy.result == 'failure' &&
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          token: ${{ secrets.PROMOTION_BOT_TOKEN }}

      - name: Revert failed deployment
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_BOT_TOKEN }}

        run: |

          git config user.email "rollback-bot@users.noreply.github.com"
          git config user.name "RollbackBot"

          BRANCH="${{ github.base_ref }}"
          BAD_COMMIT="${{ github.event.pull_request.merge_commit_sha }}"

          echo "========================================"
          echo "AUTOMATIC ROLLBACK"
          echo "========================================"

          echo "Environment:"
          echo "${{ needs.determine-environment.outputs.environment }}"

          echo "Branch:"
          echo "$BRANCH"

          echo "Bad commit:"
          echo "$BAD_COMMIT"

          echo "========================================"

          if git revert --no-edit -m 1 "$BAD_COMMIT"; then

            git push origin "HEAD:$BRANCH"

            echo "Rollback successful."

          else

            echo "Automatic rollback failed."

            git revert --abort || true

            exit 1

          fi

      - name: Create rollback issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_BOT_TOKEN }}

        run: |

          gh issue create \
            --title "Globalbiz Simulator deployment failed - automatic rollback" \
            --body "## Deployment Failure

          The Globalbiz Simulator deployment failed.

          ### Details

          - Environment: ${{ needs.determine-environment.outputs.environment }}
          - Branch: ${{ github.base_ref }}
          - Source PR: #${{ github.event.pull_request.number }}
          - Failed commit: ${{ github.event.pull_request.merge_commit_sha }}
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Action

          The workflow attempted to automatically revert the failed merge.

          Please investigate the deployment before merging additional changes."

  # ============================================================
  # CREATE PROMOTION PR
  # ============================================================

  create-promotion-pr:

    needs:
      - determine-environment
      - deploy

    if: >
      success() &&
      needs.determine-environment.outputs.should_create_promotion == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTION_BOT_TOKEN }}

      - name: Create promotion PR
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_BOT_TOKEN }}

        run: |

          SOURCE_ENV="${{ needs.determine-environment.outputs.environment }}"
          TARGET_ENV="${{ needs.determine-environment.outputs.next_environment }}"
          TARGET_BRANCH="${{ needs.determine-environment.outputs.next_branch }}"

          SOURCE_BRANCH="$SOURCE_ENV"

          if [[ "$SOURCE_ENV" == "prod" ]]; then
            SOURCE_BRANCH="main"
          fi

          MERGE_COMMIT="${{ github.event.pull_request.merge_commit_sha }}"
          PREVIOUS_PR_NUMBER="${{ github.event.pull_request.number }}"
          PREVIOUS_PR_TITLE="${{ github.event.pull_request.title }}"

          echo "========================================"
          echo "CREATING PROMOTION PR"
          echo "========================================"

          echo "Source environment: $SOURCE_ENV"
          echo "Target environment: $TARGET_ENV"
          echo "Source branch:      $SOURCE_BRANCH"
          echo "Target branch:      $TARGET_BRANCH"
          echo "Merge commit:       $MERGE_COMMIT"

          git config user.email "promotion-bot@users.noreply.github.com"
          git config user.name "PromotionBot"

          git fetch origin "$SOURCE_BRANCH"
          git fetch origin "$TARGET_BRANCH"

          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)

          PROMOTION_BRANCH="promote/${SOURCE_ENV}-to-${TARGET_ENV}/${TIMESTAMP}"

          git checkout -b "$PROMOTION_BRANCH" "origin/$TARGET_BRANCH"

          echo ""
          echo "Cherry-picking deployed commit..."

          git cherry-pick -m 1 "$MERGE_COMMIT"

          git push origin "$PROMOTION_BRANCH"

          PR_TITLE="Promote to ${TARGET_ENV^^}: ${PREVIOUS_PR_TITLE}"

          PR_BODY="## Automated Promotion

          This PR was automatically created after successful deployment of the Globalbiz Simulator to **${SOURCE_ENV}**.

          ### Promotion

          - Source environment: ${SOURCE_ENV}
          - Source branch: ${SOURCE_BRANCH}
          - Target environment: ${TARGET_ENV}
          - Target branch: ${TARGET_BRANCH}
          - Source PR: #${PREVIOUS_PR_NUMBER}
          - Commit: ${MERGE_COMMIT}
          - Deployment run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Application

          **Globalbiz Simulator**

          This promotion moves the exact deployed changes from **${SOURCE_ENV}** to **${TARGET_ENV}**.

          Review and merge this PR when the target environment is ready."

          EXISTING_PR=$(gh pr list \
            --base "$TARGET_BRANCH" \
            --head "$PROMOTION_BRANCH" \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$EXISTING_PR" ]; then

            echo "Creating promotion PR..."

            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$PROMOTION_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"

          else

            echo "Promotion PR already exists: #$EXISTING_PR"

          fi

  # ============================================================
  # CREATE BACKPORT PR
  # ============================================================

  create-backport-pr:

    needs:
      - determine-environment
      - deploy

    if: >
      success() &&
      needs.determine-environment.outputs.should_create_backport == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTION_BOT_TOKEN }}

      - name: Create backport PR
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_BOT_TOKEN }}

        run: |

          SOURCE_ENV="${{ needs.determine-environment.outputs.environment }}"
          TARGET_ENV="${{ needs.determine-environment.outputs.backport_next_env }}"
          TARGET_BRANCH="${{ needs.determine-environment.outputs.backport_next_branch }}"

          SOURCE_BRANCH="$SOURCE_ENV"

          if [[ "$SOURCE_ENV" == "prod" ]]; then
            SOURCE_BRANCH="main"
          fi

          MERGE_COMMIT="${{ github.event.pull_request.merge_commit_sha }}"
          PREVIOUS_PR_NUMBER="${{ github.event.pull_request.number }}"
          PREVIOUS_PR_TITLE="${{ github.event.pull_request.title }}"

          git config user.email "backport-bot@users.noreply.github.com"
          git config user.name "BackportBot"

          git fetch origin "$SOURCE_BRANCH"
          git fetch origin "$TARGET_BRANCH"

          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)

          BACKPORT_BRANCH="backport/${SOURCE_ENV}-to-${TARGET_ENV}/${TIMESTAMP}"

          git checkout -b "$BACKPORT_BRANCH" "origin/$TARGET_BRANCH"

          echo "Backporting commit:"
          echo "$MERGE_COMMIT"

          git cherry-pick -m 1 "$MERGE_COMMIT"

          git push origin "$BACKPORT_BRANCH"

          PR_TITLE="Backport to ${TARGET_ENV^^}: ${PREVIOUS_PR_TITLE}"

          PR_BODY="## Automated Backport

          This PR was automatically created for the Globalbiz Simulator hotfix flow.

          ### Backport

          - Source environment: ${SOURCE_ENV}
          - Target environment: ${TARGET_ENV}
          - Source branch: ${SOURCE_BRANCH}
          - Target branch: ${TARGET_BRANCH}
          - Source PR: #${PREVIOUS_PR_NUMBER}
          - Commit: ${MERGE_COMMIT}
          - Deployment run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Review and merge when the target environment is ready."

          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$BACKPORT_BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY"

  # ============================================================
  # NOTIFY
  # ============================================================

  notify-completion:

    needs:
      - determine-environment
      - deploy
      - create-promotion-pr
      - create-backport-pr

    if: >
      always() &&
      needs.deploy.result != 'cancelled' &&
      needs.deploy.result != 'skipped'

    runs-on: ubuntu-latest

    steps:

      - name: Deployment summary
        run: |

          echo ""
          echo "========================================"
          echo "GLOBALBIZ SIMULATOR DEPLOYMENT"
          echo "========================================"

          echo "Environment:"
          echo "${{ needs.determine-environment.outputs.environment }}"

          echo ""
          echo "Source:"
          echo "${{ github.head_ref }}"

          echo ""
          echo "Target:"
          echo "${{ github.base_ref }}"

          echo ""
          echo "Deployment:"
          echo "${{ needs.deploy.result }}"

          echo ""
          echo "Promotion PR:"
          echo "${{ needs.create-promotion-pr.result }}"

          echo ""
          echo "Backport PR:"
          echo "${{ needs.create-backport-pr.result }}"

          echo "========================================"

          if [[ "${{ needs.deploy.result }}" == "success" ]]; then

            echo "Deployment successful."

          else

            echo "Deployment failed."

          fi