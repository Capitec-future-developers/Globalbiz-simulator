name: Promote-Forward Deployment

run-name: Deploy from ${{ github.ref }} to ${{ github.base_ref }} - ${{ github.actor }}

# Promote-forward deployment strategy for a static site served on GitHub Pages.
#
# Flow:
#   feature/release-* -> int -> uat -> main
#
# Hotfix flow:
#   hotfix/release-* -> int/uat/main -> backport to previous environment
#
# This workflow:
#   1. Validates the source/target branch
#   2. Deploys merged changes to GitHub Pages
#   3. Runs a smoke test
#   4. Automatically rolls back a failed deployment
#   5. Creates promotion PRs
#   6. Creates backport PRs for hotfixes
#   7. Reports completion

on:
  pull_request:
    branches:
      - int
      - uat
      - main
    types:
      - opened
      - closed
      - synchronize
      - edited
      - reopened

jobs:

  # ============================================================
  # DETERMINE ENVIRONMENT
  # ============================================================

  determine-environment:
    if: >
      startsWith(github.head_ref, 'feature/release') ||
      startsWith(github.head_ref, 'promote/') ||
      startsWith(github.head_ref, 'hotfix/release') ||
      startsWith(github.head_ref, 'backport/') ||
      startsWith(github.head_ref, 'revert-')

    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.get-env.outputs.environment }}
      next_environment: ${{ steps.get-env.outputs.next_environment }}
      next_branch: ${{ steps.get-env.outputs.next_branch }}
      is_final_env: ${{ steps.get-env.outputs.is_final_env }}
      should_validate: ${{ steps.get-env.outputs.should_validate }}
      should_deploy: ${{ steps.get-env.outputs.should_deploy }}
      requires_approval: ${{ steps.get-env.outputs.requires_approval }}
      should_create_promotion: ${{ steps.get-env.outputs.should_create_promotion }}
      should_create_backport: ${{ steps.get-env.outputs.should_create_backport }}
      backport_next_env: ${{ steps.get-env.outputs.backport_next_env }}
      backport_next_branch: ${{ steps.get-env.outputs.backport_next_branch }}
      is_hotfix: ${{ steps.get-env.outputs.is_hotfix }}
      is_backport: ${{ steps.get-env.outputs.is_backport }}
      skip_promotion: ${{ steps.get-env.outputs.skip_promotion }}

    steps:

      # --------------------------------------------------------
      # Validate feature release source branch
      # --------------------------------------------------------

      - name: Validate source and target branch
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/release')
        run: |
          HEAD_REF="${{ github.head_ref }}"
          BASE_REF="${{ github.base_ref }}"

          echo "Source branch: $HEAD_REF"
          echo "Target branch: $BASE_REF"

          if [[ "$HEAD_REF" == feature/release* && "$BASE_REF" != "int" ]]; then
            echo "ERROR: feature/release branches must target 'int', not '$BASE_REF'."
            echo ""
            echo "Expected deployment flow:"
            echo "  feature/release-* -> int -> uat -> main"
            echo ""
            exit 1
          fi

          echo "Source and target branch validation passed"

      # --------------------------------------------------------
      # Determine target environment
      # --------------------------------------------------------

      - name: Determine environment from target branch
        id: get-env
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          HEAD_REF="${{ github.head_ref }}"

          IS_HOTFIX="false"
          IS_BACKPORT="false"

          if [[ "$HEAD_REF" == hotfix/release* ]]; then
            IS_HOTFIX="true"
            echo "Hotfix flow detected"

          elif [[ "$HEAD_REF" == backport/* ]]; then
            IS_BACKPORT="true"
            echo "Backport flow detected"

          elif [[ "$HEAD_REF" == feature/release* ]]; then
            echo "Feature release flow detected"

          elif [[ "$HEAD_REF" == promote/* ]]; then
            echo "Promotion flow detected"

          elif [[ "$HEAD_REF" == revert-* ]]; then
            echo "Revert flow detected"
          fi

          echo "is_hotfix=$IS_HOTFIX" >> "$GITHUB_OUTPUT"
          echo "is_backport=$IS_BACKPORT" >> "$GITHUB_OUTPUT"

          # ----------------------------------------------------
          # Detect promotion opt-out
          # ----------------------------------------------------

          SKIP_PROMOTION="false"

          if echo "$PR_BODY" | grep -qiE '^\s*-\s*\[x\]\s*Skip auto-promotion'; then
            SKIP_PROMOTION="true"
            echo "Auto-promotion skipped by PR opt-out checkbox"
          fi

          echo "skip_promotion=$SKIP_PROMOTION" >> "$GITHUB_OUTPUT"

          # ----------------------------------------------------
          # Map environment
          # ----------------------------------------------------

          case "$TARGET_BRANCH" in

            int)

              echo "environment=int" >> "$GITHUB_OUTPUT"
              echo "next_environment=uat" >> "$GITHUB_OUTPUT"
              echo "next_branch=uat" >> "$GITHUB_OUTPUT"
              echo "is_final_env=false" >> "$GITHUB_OUTPUT"
              echo "requires_approval=false" >> "$GITHUB_OUTPUT"

              if [[ "$IS_HOTFIX" == "false" &&
                    "$IS_BACKPORT" == "false" &&
                    "$SKIP_PROMOTION" == "false" ]]; then

                echo "should_create_promotion=true" >> "$GITHUB_OUTPUT"

              else

                echo "should_create_promotion=false" >> "$GITHUB_OUTPUT"

              fi

              echo "should_create_backport=false" >> "$GITHUB_OUTPUT"
              echo "backport_next_env=" >> "$GITHUB_OUTPUT"
              echo "backport_next_branch=" >> "$GITHUB_OUTPUT"

              ;;

            uat)

              echo "environment=uat" >> "$GITHUB_OUTPUT"
              echo "next_environment=prod" >> "$GITHUB_OUTPUT"
              echo "next_branch=main" >> "$GITHUB_OUTPUT"
              echo "is_final_env=false" >> "$GITHUB_OUTPUT"
              echo "requires_approval=true" >> "$GITHUB_OUTPUT"

              if [[ "$SKIP_PROMOTION" == "false" &&
                    "$HEAD_REF" == promote/* ]]; then

                echo "should_create_promotion=true" >> "$GITHUB_OUTPUT"

              else

                echo "should_create_promotion=false" >> "$GITHUB_OUTPUT"

              fi

              if [[ "$IS_BACKPORT" == "true" ]]; then

                echo "should_create_backport=true" >> "$GITHUB_OUTPUT"
                echo "backport_next_env=int" >> "$GITHUB_OUTPUT"
                echo "backport_next_branch=int" >> "$GITHUB_OUTPUT"

              else

                echo "should_create_backport=false" >> "$GITHUB_OUTPUT"
                echo "backport_next_env=" >> "$GITHUB_OUTPUT"
                echo "backport_next_branch=" >> "$GITHUB_OUTPUT"

              fi

              ;;

            main)

              echo "environment=prod" >> "$GITHUB_OUTPUT"
              echo "next_environment=" >> "$GITHUB_OUTPUT"
              echo "next_branch=" >> "$GITHUB_OUTPUT"
              echo "is_final_env=true" >> "$GITHUB_OUTPUT"
              echo "requires_approval=true" >> "$GITHUB_OUTPUT"
              echo "should_create_promotion=false" >> "$GITHUB_OUTPUT"

              if [[ "$IS_HOTFIX" == "true" ]]; then

                echo "should_create_backport=true" >> "$GITHUB_OUTPUT"
                echo "backport_next_env=uat" >> "$GITHUB_OUTPUT"
                echo "backport_next_branch=uat" >> "$GITHUB_OUTPUT"

              else

                echo "should_create_backport=false" >> "$GITHUB_OUTPUT"
                echo "backport_next_env=" >> "$GITHUB_OUTPUT"
                echo "backport_next_branch=" >> "$GITHUB_OUTPUT"

              fi

              ;;

            *)

              echo "Unknown target branch: $TARGET_BRANCH"
              exit 1

              ;;

          esac

          # ----------------------------------------------------
          # Determine whether deployment should happen
          # ----------------------------------------------------

          if [ "${{ github.event.pull_request.merged }}" == "true" ]; then

            echo "should_validate=true" >> "$GITHUB_OUTPUT"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"

          else

            echo "should_validate=true" >> "$GITHUB_OUTPUT"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"

          fi

          echo "Target environment: $TARGET_BRANCH"
          echo "PR merged: ${{ github.event.pull_request.merged }}"

  # ============================================================
  # VALIDATE ONLY
  # ============================================================

  validate-only:
    needs:
      - determine-environment

    if: >
      needs.determine-environment.outputs.should_validate == 'true' &&
      needs.determine-environment.outputs.should_deploy == 'false'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Report target environment
        run: |
          echo "Target environment: ${{ needs.determine-environment.outputs.environment }}"
          echo "Source branch: ${{ github.head_ref }}"
          echo "Target branch: ${{ github.base_ref }}"
          echo "Will deploy automatically once merged"

  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    needs:
      - determine-environment

    if: >
      needs.determine-environment.outputs.should_deploy == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # --------------------------------------------------------
      # Checkout merged target branch
      # --------------------------------------------------------

      - name: Checkout merged branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      # --------------------------------------------------------
      # Build
      #
      # Your simulator is currently a static HTML/JS application.
      # Therefore no npm build is required here.
      #
      # If you later introduce a build process, uncomment:
      #
      # - name: Install dependencies
      #   run: npm ci
      #
      # - name: Build application
      #   run: npm run build
      # --------------------------------------------------------

      - name: Prepare static site
        run: |
          echo "Preparing static site for GitHub Pages"
          mkdir -p _site

          ENV_NAME="${{ needs.determine-environment.outputs.environment }}"

          mkdir -p "_site/$ENV_NAME"

          # Copy repository contents into environment folder.
          cp -r . "_site/$ENV_NAME/" 2>/dev/null || true

          # Remove GitHub metadata and generated deployment directory.
          rm -rf "_site/$ENV_NAME/.git"
          rm -rf "_site/$ENV_NAME/_site"

          echo "Static site prepared for environment: $ENV_NAME"

      # --------------------------------------------------------
      # Upload Pages artifact
      # --------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # --------------------------------------------------------
      # Deploy to GitHub Pages
      # --------------------------------------------------------

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # --------------------------------------------------------
      # Smoke test
      # --------------------------------------------------------

      - name: Smoke test deployed site
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"

          echo "Checking deployed site:"
          echo "$URL"

          sleep 15

          STATUS=$(curl \
            -s \
            -o /tmp/body.html \
            -w "%{http_code}" \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "$URL" || echo "000")

          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Site returned HTTP $STATUS instead of 200"
            exit 1
          fi

          if ! grep -qi "<html" /tmp/body.html; then
            echo "Response did not contain a valid HTML document"
            exit 1
          fi

          echo "Smoke test passed"

  # ============================================================
  # ROLLBACK
  # ============================================================

  # If deployment or the smoke test fails:
  #
  # 1. Checkout the target branch
  # 2. Revert the bad merge commit
  # 3. Push the revert
  # 4. Create a GitHub issue
  #
  # This replaces the malformed auto-rollback block that was
  # previously nested inside notify-completion.

  rollback:
    needs:
      - determine-environment
      - deploy

    if: >
      failure() &&
      needs.deploy.result == 'failure'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:

      # --------------------------------------------------------
      # Checkout target branch
      # --------------------------------------------------------

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          token: ${{ secrets.PROMOTION_BOT_TOKEN }}

      # --------------------------------------------------------
      # Revert failed merge
      # --------------------------------------------------------

      - name: Revert the bad merge commit
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_BOT_TOKEN }}

        run: |
          git config user.email "rollback-bot@users.noreply.github.com"
          git config user.name "RollbackBot"

          BRANCH="${{ github.base_ref }}"
          BAD_COMMIT="${{ github.event.pull_request.merge_commit_sha }}"

          echo "========================================"
          echo "AUTOMATIC ROLLBACK"
          echo "========================================"
          echo "Environment: ${{ needs.determine-environment.outputs.environment }}"
          echo "Branch: $BRANCH"
          echo "Bad commit: $BAD_COMMIT"
          echo "========================================"

          if git revert --no-edit -m 1 "$BAD_COMMIT"; then

            git push origin "HEAD:$BRANCH"

            echo "reverted=true" >> "$GITHUB_ENV"

            echo "Rollback completed successfully."

          else

            echo "Automatic revert encountered a conflict."

            git revert --abort || true

            echo "reverted=false" >> "$GITHUB_ENV"

            exit 1

          fi

      # --------------------------------------------------------
      # Create rollback issue
      # --------------------------------------------------------

      - name: Open rollback issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_BOT_TOKEN }}

        run: |
          ENV_NAME="${{ needs.determine-environment.outputs.environment }}"
          BRANCH="${{ github.base_ref }}"

          if [ "${reverted:-false}" == "true" ]; then

            STATUS_LINE="A revert commit was pushed to \`${BRANCH}\`. The previous known-good version will be redeployed."

          else

            STATUS_LINE="**Automatic revert failed due to a conflict. Manual rollback is required.**"

          fi

          gh issue create \
            --title "Deployment to ${ENV_NAME} failed and was rolled back" \
            --body "The deployment to **${ENV_NAME}** failed.

          ## Deployment Details

          - **Environment:** ${ENV_NAME}
          - **Branch:** ${BRANCH}
          - **Failed Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Bad Commit:** ${{ github.event.pull_request.merge_commit_sha }}
          - **Source PR:** #${{ github.event.pull_request.number }}

          ## Rollback Status

          ${STATUS_LINE}

          ## Next Steps

          Please investigate the failed deployment before merging further changes into **${BRANCH}**."

  # ============================================================
  # CREATE PROMOTION PR
  # ============================================================

  create-promotion-pr:
    needs:
      - determine-environment
      - deploy

    if: >
      success() &&
      needs.determine-environment.outputs.should_create_promotion == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTION_BOT_TOKEN }}

      - name: Create promotion PR
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_BOT_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}

        run: |

          SOURCE_ENV="${{ needs.determine-environment.outputs.environment }}"
          TARGET_ENV="${{ needs.determine-environment.outputs.next_environment }}"
          TARGET_BRANCH="${{ needs.determine-environment.outputs.next_branch }}"

          case "$SOURCE_ENV" in
            int)
              SOURCE_BRANCH="int"
              ;;
            uat)
              SOURCE_BRANCH="uat"
              ;;
            prod)
              SOURCE_BRANCH="main"
              ;;
            *)
              SOURCE_BRANCH="$SOURCE_ENV"
              ;;
          esac

          PREVIOUS_PR_NUMBER="${{ github.event.pull_request.number }}"
          PREVIOUS_PR_TITLE="$PR_TITLE"

          cat << 'EOFPRBODY' > /tmp/pr_body.txt
          ${{ github.event.pull_request.body }}
          EOFPRBODY

          PREVIOUS_PR_BODY=$(cat /tmp/pr_body.txt)

          if echo "$PREVIOUS_PR_BODY" | grep -q "## Automated Promotion"; then

            ORIGINAL_CONTENT=$(echo "$PREVIOUS_PR_BODY" |
              sed -n '/### Original PR Details/,/^---$/p' |
              sed '1d;$d')

            ORIGINAL_AUTHOR=$(echo "$PREVIOUS_PR_BODY" |
              grep -oP '(?<=\*\*Actor\*\*: @)\S+' |
              head -1)

          else

            ORIGINAL_CONTENT="$PREVIOUS_PR_BODY"
            ORIGINAL_AUTHOR="${{ github.event.pull_request.user.login }}"

          fi

          git config user.email "promotion-bot@users.noreply.github.com"
          git config user.name "PromotionBot"

          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          MERGE_COMMIT="${{ github.event.pull_request.merge_commit_sha }}"

          echo "Merge commit to promote: $MERGE_COMMIT"

          git fetch origin "$SOURCE_BRANCH"
          git fetch origin "$TARGET_BRANCH"

          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          PROMOTION_BRANCH="promote/${SOURCE_ENV}-to-${TARGET_ENV}/${TIMESTAMP}"

          git checkout -b "$PROMOTION_BRANCH" "origin/$TARGET_BRANCH"

          echo "Cherry-picking changes from $SOURCE_BRANCH"

          MODIFY_DELETE_WARNING=""

          if git cherry-pick -m 1 "$MERGE_COMMIT"; then

            echo "Cherry-pick successful"

          else

            if git status | grep -q "nothing to commit"; then

              echo "Changes already exist in target branch"

              git cherry-pick --skip

              if git diff --quiet "origin/$TARGET_BRANCH" HEAD; then

                echo "No changes to promote"
                exit 0

              fi

            else

              echo "Cherry-pick had conflicts"

              MODIFY_DELETE_FILES=""

              while IFS= read -r conflicted_file; do

                if ! git show "origin/$TARGET_BRANCH":"$conflicted_file" > /dev/null 2>&1; then

                  echo "Resolving modify/delete conflict: $conflicted_file"

                  git rm "$conflicted_file"

                  MODIFY_DELETE_FILES="${MODIFY_DELETE_FILES}- \`$conflicted_file\`\n"

                fi

              done < <(git diff --name-only --diff-filter=U)

              if [ -n "$MODIFY_DELETE_FILES" ]; then

                MODIFY_DELETE_WARNING="$(printf '\n> [!WARNING]\n> Modify/delete conflicts were automatically resolved.\n>\n> %s' "$(echo -e "$MODIFY_DELETE_FILES")")"

              fi

              PARTIAL_APPLY_WARNING=""
              PARTIAL_APPLY_FILES=""

              while IFS= read -r conflicted_file; do

                echo "Resolving both-modified conflict: $conflicted_file"

                PR_FILE_DIFF=$(git diff \
                  "${MERGE_COMMIT}^1" \
                  "${MERGE_COMMIT}" \
                  -- "$conflicted_file")

                git checkout --ours -- "$conflicted_file"

                if [ -n "$PR_FILE_DIFF" ] &&
                   echo "$PR_FILE_DIFF" |
                   git apply --3way --whitespace=nowarn 2>/dev/null; then

                  echo "PR changes applied: $conflicted_file"

                else

                  echo "Could not apply PR changes: $conflicted_file"

                  PARTIAL_APPLY_FILES="${PARTIAL_APPLY_FILES}- \`$conflicted_file\`\n"

                fi

                git add "$conflicted_file"

              done < <(
                git status --porcelain |
                grep '^UU' |
                awk '{print $2}'
              )

              if [ -n "$PARTIAL_APPLY_FILES" ]; then

                PARTIAL_APPLY_WARNING="$(printf '\n> [!WARNING]\n> Partial conflict resolution occurred.\n>\n> %s' "$(echo -e "$PARTIAL_APPLY_FILES")")"

              fi

              if ! git cherry-pick --continue --no-edit; then

                echo "Failed to complete cherry-pick"

                git cherry-pick --abort

                exit 1

              fi

              echo "Conflicts resolved"

            fi

          fi

          if git diff --quiet "origin/$TARGET_BRANCH" HEAD; then

            echo "No changes to promote"
            exit 0

          fi

          git push origin "$PROMOTION_BRANCH"

          BASE_TITLE="$PREVIOUS_PR_TITLE"

          REGEX_WITH_AUTHOR='^Promote to [A-Z]+: (.+) \(by @[^)]+\)$'
          REGEX_WITHOUT_AUTHOR='^Promote to [A-Z]+: (.+)$'

          if [[ "$BASE_TITLE" =~ $REGEX_WITH_AUTHOR ]]; then

            BASE_TITLE="${BASH_REMATCH[1]}"

          elif [[ "$BASE_TITLE" =~ $REGEX_WITHOUT_AUTHOR ]]; then

            BASE_TITLE="${BASH_REMATCH[1]}"

          fi

          PR_TITLE="Promote to ${TARGET_ENV^^}: ${BASE_TITLE} (by @${ORIGINAL_AUTHOR})"

          PR_BODY="## Automated Promotion

          ${MODIFY_DELETE_WARNING}${PARTIAL_APPLY_WARNING}

          This PR was automatically created after successful deployment to **${SOURCE_ENV}**.

          ### Previous Environment PR

          - **Source PR:** #${PREVIOUS_PR_NUMBER}
          - **Title:** ${PREVIOUS_PR_TITLE}
          - **Deployed to ${SOURCE_ENV}:** Success
          - **Deployment Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Deployment Information

          - **Source Environment:** ${SOURCE_ENV}
          - **Target Environment:** ${TARGET_ENV}
          - **Promotion Branch:** ${PROMOTION_BRANCH}
          - **Target Branch:** ${TARGET_BRANCH}
          - **Commit:** ${MERGE_COMMIT}
          - **Actor:** @${ORIGINAL_AUTHOR}
          - **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          ### Original PR Details

          ${ORIGINAL_CONTENT}

          ---

          **Note:** This PR contains only the changes that were deployed to ${SOURCE_ENV}. Review and merge when ready to deploy to ${TARGET_ENV}."

          EXISTING_PR=$(gh pr list \
            --base "$TARGET_BRANCH" \
            --head "$PROMOTION_BRANCH" \
            --json number \
            --jq '.[0].number' \
            2>/dev/null || echo "")

          if [ -z "$EXISTING_PR" ]; then

            echo "Creating promotion PR"

            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$PROMOTION_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"

          else

            echo "Promotion PR already exists: #$EXISTING_PR"

            gh pr edit "$EXISTING_PR" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"

          fi

  # ============================================================
  # CREATE BACKPORT PR
  # ============================================================

  create-backport-pr:
    needs:
      - determine-environment
      - deploy

    if: >
      success() &&
      needs.determine-environment.outputs.should_create_backport == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTION_BOT_TOKEN }}

      - name: Create backport PR
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_BOT_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}

        run: |

          SOURCE_ENV="${{ needs.determine-environment.outputs.environment }}"
          TARGET_ENV="${{ needs.determine-environment.outputs.backport_next_env }}"
          TARGET_BRANCH="${{ needs.determine-environment.outputs.backport_next_branch }}"

          case "$SOURCE_ENV" in
            int)
              SOURCE_BRANCH="int"
              ;;
            uat)
              SOURCE_BRANCH="uat"
              ;;
            prod)
              SOURCE_BRANCH="main"
              ;;
            *)
              SOURCE_BRANCH="$SOURCE_ENV"
              ;;
          esac

          PREVIOUS_PR_NUMBER="${{ github.event.pull_request.number }}"
          PREVIOUS_PR_TITLE="$PR_TITLE"

          cat << 'EOFPRBODY' > /tmp/pr_body.txt
          ${{ github.event.pull_request.body }}
          EOFPRBODY

          PREVIOUS_PR_BODY=$(cat /tmp/pr_body.txt)

          if echo "$PREVIOUS_PR_BODY" | grep -q "## Automated Backport"; then

            ORIGINAL_CONTENT=$(echo "$PREVIOUS_PR_BODY" |
              sed -n '/### Original Hotfix PR Details/,/^---$/p' |
              sed '1d;$d')

            ORIGINAL_AUTHOR=$(echo "$PREVIOUS_PR_BODY" |
              grep -oP '(?<=\*\*Original Author\*\*: @)\S+' |
              head -1)

            ORIGINAL_HOTFIX_PR=$(echo "$PREVIOUS_PR_BODY" |
              grep -oP '(?<=\*\*Original Hotfix PR\*\*: #)\d+' |
              head -1)

          else

            ORIGINAL_CONTENT="$PREVIOUS_PR_BODY"
            ORIGINAL_AUTHOR="${{ github.event.pull_request.user.login }}"
            ORIGINAL_HOTFIX_PR="$PREVIOUS_PR_NUMBER"

          fi

          git config user.email "backport-bot@users.noreply.github.com"
          git config user.name "BackportBot"

          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          MERGE_COMMIT="${{ github.event.pull_request.merge_commit_sha }}"

          echo "Merge commit to backport: $MERGE_COMMIT"

          git fetch origin "$SOURCE_BRANCH"
          git fetch origin "$TARGET_BRANCH"

          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          BACKPORT_BRANCH="backport/${SOURCE_ENV}-to-${TARGET_ENV}/${TIMESTAMP}"

          git checkout -b "$BACKPORT_BRANCH" "origin/$TARGET_BRANCH"

          MODIFY_DELETE_WARNING=""

          if git cherry-pick -m 1 "$MERGE_COMMIT"; then

            echo "Cherry-pick successful"

          else

            if git status | grep -q "nothing to commit"; then

              git cherry-pick --skip

              if git diff --quiet "origin/$TARGET_BRANCH" HEAD; then
                echo "No changes to backport"
                exit 0
              fi

            else

              MODIFY_DELETE_FILES=""

              while IFS= read -r conflicted_file; do

                if ! git show "origin/$TARGET_BRANCH":"$conflicted_file" > /dev/null 2>&1; then

                  git rm "$conflicted_file"

                  MODIFY_DELETE_FILES="${MODIFY_DELETE_FILES}- \`$conflicted_file\`\n"

                fi

              done < <(git diff --name-only --diff-filter=U)

              if [ -n "$MODIFY_DELETE_FILES" ]; then

                MODIFY_DELETE_WARNING="$(printf '\n> [!WARNING]\n> Modify/delete conflicts were automatically resolved.\n>\n> %s' "$(echo -e "$MODIFY_DELETE_FILES")")"

              fi

              PARTIAL_APPLY_WARNING=""
              PARTIAL_APPLY_FILES=""

              while IFS= read -r conflicted_file; do

                PR_FILE_DIFF=$(git diff \
                  "${MERGE_COMMIT}^1" \
                  "${MERGE_COMMIT}" \
                  -- "$conflicted_file")

                git checkout --ours -- "$conflicted_file"

                if [ -n "$PR_FILE_DIFF" ] &&
                   echo "$PR_FILE_DIFF" |
                   git apply --3way --whitespace=nowarn 2>/dev/null; then

                  echo "PR changes applied: $conflicted_file"

                else

                  PARTIAL_APPLY_FILES="${PARTIAL_APPLY_FILES}- \`$conflicted_file\`\n"

                fi

                git add "$conflicted_file"

              done < <(
                git status --porcelain |
                grep '^UU' |
                awk '{print $2}'
              )

              if [ -n "$PARTIAL_APPLY_FILES" ]; then

                PARTIAL_APPLY_WARNING="$(printf '\n> [!WARNING]\n> Partial conflict resolution occurred.\n>\n> %s' "$(echo -e "$PARTIAL_APPLY_FILES")")"

              fi

              if ! git cherry-pick --continue --no-edit; then

                git cherry-pick --abort
                exit 1

              fi

            fi

          fi

          if git diff --quiet "origin/$TARGET_BRANCH" HEAD; then

            echo "No changes to backport"
            exit 0

          fi

          git push origin "$BACKPORT_BRANCH"

          BASE_TITLE="$PREVIOUS_PR_TITLE"

          REGEX_BACKPORT_WITH_AUTHOR='^Backport to [A-Z]+: (.+) \(hotfix by @[^)]+\)$'
          REGEX_BACKPORT_WITHOUT_AUTHOR='^Backport to [A-Z]+: (.+)$'

          if [[ "$BASE_TITLE" =~ $REGEX_BACKPORT_WITH_AUTHOR ]]; then

            BASE_TITLE="${BASH_REMATCH[1]}"

          elif [[ "$BASE_TITLE" =~ $REGEX_BACKPORT_WITHOUT_AUTHOR ]]; then

            BASE_TITLE="${BASH_REMATCH[1]}"

          fi

          PR_TITLE="Backport to ${TARGET_ENV^^}: ${BASE_TITLE} (hotfix by @${ORIGINAL_AUTHOR})"

          PR_BODY="## Automated Backport

          ${MODIFY_DELETE_WARNING}${PARTIAL_APPLY_WARNING}

          This PR was automatically created after successful hotfix deployment to **${SOURCE_ENV}**.

          ### Previous Deployment PR

          - **Source PR:** #${PREVIOUS_PR_NUMBER}
          - **Title:** ${PREVIOUS_PR_TITLE}
          - **Deployed to ${SOURCE_ENV}:** Success
          - **Deployment Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Backport Information

          - **Source Environment:** ${SOURCE_ENV}
          - **Target Environment:** ${TARGET_ENV}
          - **Backport Branch:** ${BACKPORT_BRANCH}
          - **Target Branch:** ${TARGET_BRANCH}
          - **Commit:** ${MERGE_COMMIT}
          - **Original Author:** @${ORIGINAL_AUTHOR}
          - **Original Hotfix PR:** #${ORIGINAL_HOTFIX_PR}
          - **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          ### Original Hotfix PR Details

          ${ORIGINAL_CONTENT}

          ---

          **Note:** This PR contains the hotfix changes deployed to ${SOURCE_ENV}. Review and merge when ready to deploy to ${TARGET_ENV}."

          EXISTING_PR=$(gh pr list \
            --base "$TARGET_BRANCH" \
            --head "$BACKPORT_BRANCH" \
            --json number \
            --jq '.[0].number' \
            2>/dev/null || echo "")

          if [ -z "$EXISTING_PR" ]; then

            echo "Creating backport PR"

            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$BACKPORT_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"

          else

            echo "Backport PR already exists: #$EXISTING_PR"

            gh pr edit "$EXISTING_PR" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"

          fi

  # ============================================================
  # NOTIFY COMPLETION
  # ============================================================

  # This MUST remain a normal job under jobs:.
  #
  # There must NOT be another job definition inside the run: block.

  notify-completion:
    needs:
      - determine-environment
      - deploy
      - create-promotion-pr
      - create-backport-pr

    if: >
      always() &&
      needs.deploy.result != 'cancelled' &&
      needs.deploy.result != 'skipped'

    runs-on: ubuntu-latest

    steps:

      - name: Log completion
        run: |

          echo "========================================"
          echo "DEPLOYMENT COMPLETE"
          echo "========================================"

          echo "Environment:"
          echo "${{ needs.determine-environment.outputs.environment }}"

          echo "Deployment result:"
          echo "${{ needs.deploy.result }}"

          echo "Next environment:"
          echo "${{ needs.determine-environment.outputs.next_environment }}"

          echo "Promotion PR result:"
          echo "${{ needs.create-promotion-pr.result }}"

          echo "Backport PR result:"
          echo "${{ needs.create-backport-pr.result }}"

          echo "========================================"

          if [ "${{ needs.create-promotion-pr.result }}" == "success" ]; then
            echo "Promotion PR created successfully"
          fi

          if [ "${{ needs.create-backport-pr.result }}" == "success" ]; then
            echo "Backport PR created successfully"
          fi

          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "Deployment successful"
          else
            echo "Deployment failed"
          fi

          echo "========================================"
