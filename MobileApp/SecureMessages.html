<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Messages</title>
    <link rel="stylesheet" href="../styles/MobileApp.css">
    <link rel="icon" type="image/x-icon" href="../images/profile.jpg">
</head>
<body class="ma-body-root">

<div class="ma-viewport ma-theme-white ma-has-bottomnav">

    <div class="ma-statusbar ma-statusbar-dark">
        <span class="ma-statusbar-time">13:29</span>

            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 4a10 8 0 0 1 14 0M3.5 7a6 5 0 0 1 9 0M6 10a2.3 2 0 0 1 4 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span class="ma-battery">62<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg></span>
        </span>
    </div>

    <div class="ma-header ma-header-dark">
        <a class="ma-header-back" href="Home.html" aria-label="Back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

        <span class="ma-header-title">Secure Messages</span>
    </div>

    <div class="ma-tabs">
        <button class="ma-tab" type="button" data-tab="inbox">Inbox</button>
        <button class="ma-tab" type="button" data-tab="sent">Sent</button>

    <a class="ma-compose-row" href="CreateMessage.html">
        <span>Create new message</span>

    </a>

    <div class="ma-body">
        <div id="maInboxPane">
            <div class="ma-empty" id="maInboxEmpty">
                <div class="ma-empty-icon">
                    <svg width="120" height="96" viewBox="0 0 120 96" fill="none">
                        <path d="M14 30h92v52a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V30z" stroke="#16232f" stroke-width="1.6" stroke-linejoin="round" fill="#fff"/>
                        <path d="M14 30l46 34 46-34" stroke="#16232f" stroke-width="1.6" stroke-linejoin="round" fill="none"/>

                        <rect x="52" y="35" width="16" height="3" rx="1.5" fill="#c0272d"/>
                        <circle cx="94" cy="20" r="9" fill="#1a56db"/>
                        <text x="94" y="24" font-size="10" font-family="-apple-system, sans-serif" fill="#fff" text-anchor="middle">0</text>
                    </svg>
                </div>
                <p class="ma-empty-title">Inbox empty</p>
                <p class="ma-empty-sub">You can send a message to a Relationship Banker and they will get back to you.</p>
            </div>
            <div class="ma-empty-fill"></div>
        </div>

        <div id="maSentPane" style="display: none;">
            <div class="ma-empty" id="maSentEmpty">
                <div class="ma-empty-icon">
                    <svg width="120" height="96" viewBox="0 0 120 96" fill="none">
                        <path d="M14 30h92v52a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V30z" stroke="#16232f" stroke-width="1.6" stroke-linejoin="round" fill="#fff"/>
                        <path d="M14 30l46 34 46-34" stroke="#16232f" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
                        <rect x="46" y="10" width="42" height="30" rx="2" fill="#fff" stroke="#c9cfda" stroke-width="1.4"/>
                        <rect x="52" y="18" width="14" height="14" rx="2" fill="#eef1f7"/>
                        <rect x="70" y="18" width="14" height="4" rx="2" fill="#e2e6ee"/>
                        <rect x="70" y="25" width="14" height="4" rx="2" fill="#e2e6ee"/>
                        <rect x="52" y="35" width="16" height="3" rx="1.5" fill="#c0272d"/>
                        <circle cx="94" cy="20" r="9" fill="#1a56db"/>
                        <text x="94" y="24" font-size="10" font-family="-apple-system, sans-serif" fill="#fff" text-anchor="middle">0</text>
                    </svg>
                </div>
                <p class="ma-empty-title">No sent messages</p>
                <p class="ma-empty-sub">You&rsquo;ll find the messages you send to us here.</p>
            </div>
            <div class="ma-card" id="maSentList" style="display: none;"></div>
        </div>
    </div>

    <div class="ma-bottomnav">
        <a class="ma-nav-item" href="Home.html">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <span>Home</span>
        </a>
        <a class="ma-nav-item" href="Home.html">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="15" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="6" y="4" width="15" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/></svg>
            <span>Accounts</span>

        <a class="ma-nav-item" href="Home.html">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 8h14M14 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 16H6M10 12l-4 4 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Transact</span>
        </a>
        <a class="ma-nav-item" href="Cards.html">

            <span>Cards</span>
        </a>
        <a class="ma-nav-item" href="Home.html">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="14" r="4" stroke="currentColor" stroke-width="1.8"/><circle cx="16" cy="14" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 12V8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>Explore</span>
        </a>
    </div>

</div>

<script src="../scripts/MobileApp.js"></script>
</body>
</html>
