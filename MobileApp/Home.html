<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="../styles/MobileApp.css">
    <link rel="icon" type="image/x-icon" href="../images/profile.jpg">
</head>
<body class="ma-body-root">

<div class="ma-viewport ma-has-bottomnav">

    <div class="ma-statusbar">
        <span class="ma-statusbar-time">13:27</span>
        <span class="ma-statusbar-icons">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 4a10 8 0 0 1 14 0M3.5 7a6 5 0 0 1 9 0M6 10a2.3 2 0 0 1 4 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span class="ma-battery">62<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg></span>
        </span>
    </div>

    <div class="ma-profile-row">
        <div class="ma-avatar">MH</div>
        <div class="ma-profile-identity">
            <div class="ma-profile-name">Maryjane Halvorson</div>
            <button class="ma-profile-toggle" type="button">
                <span>Maryjane Halvor&hellip;</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
        <button class="ma-call-btn" type="button" aria-label="Call support">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.6 3.2 4.2 5.8 7.4 7.4l2.5-2.5a1.2 1.2 0 0 1 1.2-.3c1.3.4 2.7.6 4.1.6a1.2 1.2 0 0 1 1.2 1.2v3.6a1.2 1.2 0 0 1-1.2 1.2C10.7 22 2 13.3 2 3.2A1.2 1.2 0 0 1 3.2 2h3.6A1.2 1.2 0 0 1 8 3.2c0 1.4.2 2.8.6 4.1.1.4 0 .9-.3 1.2L6.6 10.8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
    </div>

    <div class="ma-body">
        <div class="ma-card-row">
            <h3>Accounts</h3>
            <a class="ma-link" href="#">View all</a>
        </div>

        <div class="ma-card" style="padding: 6px 18px;">
            <div class="ma-list-row">
                <span class="ma-list-row-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M17 7L7 17M7 7h10v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="ma-list-row-body">
                    <span class="ma-list-row-name">1 Current Account</span>
                </span>
                <span class="ma-list-row-amount">R0.00</span>
            </div>
            <div class="ma-list-row">
                <span class="ma-list-row-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 20V13M9 20V9M14 20V5M19 20V10M14 5l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="ma-list-row-body">
                    <span class="ma-list-row-name">1 Savings Account</span>
                </span>
                <span class="ma-list-row-amount">R0.00</span>
            </div>
        </div>

        <div class="ma-card-row" style="margin-top: 8px;">
            <h3>Favourites</h3>
            <a class="ma-link" href="#">Edit</a>
        </div>

        <div class="ma-fav-grid">
            <button class="ma-fav-card" type="button">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="17" cy="9" r="2.4" stroke="currentColor" stroke-width="1.8"/><path d="M14.5 20c.3-2.3 2.1-4 4.5-4s4.2 1.7 4.5 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <span>Pay beneficiary</span>
            </button>
            <button class="ma-fav-card" type="button">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="15" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M2 10h15" stroke="currentColor" stroke-width="1.8"/><path d="M17 13l5 0M19 10.5L22 13l-3 2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Pay once-off beneficiary</span>
            </button>
            <button class="ma-fav-card" type="button">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="17" cy="9" r="2.4" stroke="currentColor" stroke-width="1.8"/><path d="M14.5 20c.3-2.3 2.1-4 4.5-4s4.2 1.7 4.5 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <span>Group or Multiple payments</span>
            </button>
            <button class="ma-fav-card" type="button">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 8h14M14 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 16H6M10 12l-4 4 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Transfer money</span>
            </button>
        </div>
    </div>

    <div class="ma-bottomnav">
        <a class="ma-nav-item active" href="Home.html">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <span>Home</span>
        </a>
        <a class="ma-nav-item" href="Home.html">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="15" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="6" y="4" width="15" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/></svg>
            <span>Accounts</span>
        </a>
        <a class="ma-nav-item" href="Home.html">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 8h14M14 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 16H6M10 12l-4 4 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Transact</span>
        </a>
        <a class="ma-nav-item" href="Cards.html">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>Cards</span>
        </a>
        <a class="ma-nav-item" href="Home.html">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="14" r="4" stroke="currentColor" stroke-width="1.8"/><circle cx="16" cy="14" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 12V8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>Explore</span>
        </a>
    </div>

</div>

<script src="../scripts/MobileApp.js"></script>
</body>
</html>
