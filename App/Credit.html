<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit</title>
    <link rel="stylesheet" href="../styles/Phone2.css">
    <link rel="stylesheet" href="../styles/Explore-newlook.css">
    <link rel="stylesheet" href="../styles/chatbot.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../images/profile.jpg">
</head>
<body>

<div class="search-container">
    <input type="text" id="automation-search" placeholder="What would you like to do? (e.g., 'Pay saved beneficiary')" />
    <button id="execute-automation" class="search-button">
        <span class="material-icons-sharp">search</span> Go
    </button>
    <div id="suggestions-dropdown" class="suggestions-dropdown"></div>
</div>

<div class="iphone">
    <div class="volume-buttons">
        <div class="volume-up"></div>
        <div class="volume-down"></div>
    </div>
    <div class="power-button"></div>

    <div class="screen">
        <div class="notch"></div>
        <div class="screen-content">

            <div class="head">
                <a href="Explore.html" class="arrow" style="text-decoration: none;">
                    <span class="material-icons-sharp">arrow_back</span>
                </a>
                <div class="header" style="font-size: 0.9rem;">Credit</div>
            </div>

            <button class="chatbot-toggler">
                <span class="material-icons-sharp">mode_comment</span>
                <span class="material-icons-sharp">close</span>
            </button>
            <div class="chatbot">
                <header>
                    <h2>BIZCHAT</h2>
                    <span class="material-icons-sharp">close</span>
                </header>
                <ul class="chatbox">
                    <li class="chat incoming">
                        <span class="material-icons-sharp">account_circle</span>
                        <p>Welcome to Bizchat, how can I help?</p>
                    </li>
                    <li class="chat outgoing"></li>
                </ul>
                <div class="chat-input">
                    <textarea placeholder="Type your message here..." required></textarea>
                    <span id="send-btn" class="material-icons-sharp">send</span>
                </div>
            </div>

            <div class="content" id="mainContent" style="top: 120px;">
                <div class="credit-empty-card">
                    <div class="credit-empty-icon">
                        <span class="material-icons-sharp">verified</span>
                        <span class="material-icons-sharp">sync_problem</span>
                    </div>
                    <p>You currently have no available credit offers</p>
                </div>
            </div>

            <div class="bottom-nav" id="bottomNav">
                <a href="Phone2.html" class="nav-item" id="Homee">
                    <img src="../images/home.svg" alt="home" style="filter: brightness(0) invert(50%) contrast(80%)" />
                    <span>Home</span>
                </a>
                <a href="Phone%20accounts.html" class="nav-item">
                    <img src="../images/accounts.svg" alt="accounts" style="filter: brightness(0) invert(50%) contrast(80%)" />
                    <span>Accounts</span>
                </a>
                <a href="Phone%20Transact.html" class="nav-item" id="transact">
                    <img src="../images/transact.svg" alt="transact" style="filter: brightness(0) invert(50%) contrast(80%)"/>
                    <span>Transact</span>
                </a>
                <a href="Phone-cards.html" class="nav-item" id="cards">
                    <img src="../images/cards-action.svg" alt="cards" style="filter: brightness(0) invert(50%) contrast(80%)"/>
                    <span>Cards</span>
                </a>
                <a href="Explore.html" class="nav-item active">
                    <span class="nav-icon material-icons-outlined">search</span>
                    <span>Explore</span>
                </a>
            </div>
        </div>
        <div class="home-indicator"></div>
    </div>
</div>

<script src="../scripts/App.js"></script>
<script src="../scripts/Automation.js"></script>
<script src="../scripts/chatbot.js"></script>
</body>
</html>
