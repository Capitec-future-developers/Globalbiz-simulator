<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles/Phone-account.css">
  <link rel="stylesheet" href="../styles/Phone-account-newlook.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="../images/profile.jpg">
  <title>iPhone with White LCD</title>
</head>
<body>
<div class="search-container">
  <input type="text" id="automation-search" placeholder="What would you like to do? (e.g., 'Pay saved beneficiary')">
  <button id="execute-automation" class="search-button">
    <span class="material-icons-sharp">search</span> Go
  </button>
  <div id="suggestions-dropdown" class="suggestions-dropdown"></div>
</div>

<div class="iphone">
  <div class="volume-buttons">
    <div class="volume-up"></div>
    <div class="volume-down"></div>
  </div>
  <div class="power-button"></div>
  <div class="screen">
    <div class="notch"></div>
    <div class="screen-content">
      <div class="head classic-only">
        <a class="arrow" href="Phone2.html" style="text-decoration: none;">
          <span class="material-icons-sharp">arrow_back</span>
        </a>
        <div class="header" style="left: 90px; font-size: 1rem; bottom: 10px;">Current Account</div>
      </div>



      <div class="content classic-only" id="mainContent">
        <div class="account">
          <div class="account-header">
         </div>
          <div class="box">
            <div class="box1">
              <img src="../images/transact.svg">
              <span class="separator"></span>
              <div class="account-details">
                <span class="account-name">1 Account Current</span>
                <span class="account-balance">R1000</span>
                <a href="Phone-accountDetails.html" class="View">
                  <span class="material-icons-sharp">chevron_right</span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="nl-accounts-content new-look-only">
        <div class="nl-accounts-topbar">
          <a href="Phone2.html" class="nl-back"><span class="material-icons-sharp">arrow_back</span></a>
          <h2>Accounts</h2>
        </div>

        <div class="nl-accounts-search">
          <span class="material-icons-sharp">search</span>
          <input type="text" id="nlAccountSearch" placeholder="Search accounts">
        </div>

        <div class="nl-filter-pills" id="nlFilterPills">
          <button class="nl-pill" type="button" data-filter="all">All</button>
          <button class="nl-pill" type="button" data-filter="current">Current</button>
          <button class="nl-pill active" type="button" data-filter="savings">Savings</button>
          <button class="nl-pill" type="button" data-filter="credit">Credit</button>
        </div>

        <div class="nl-account-list" id="nlAccountList">
          <a href="Phone-accountDetails.html" class="nl-account-list-card" data-type="savings" data-name="business 32 day notice account">
            <span class="nl-account-accent"></span>
            <div class="nl-account-list-info">
              <div class="nl-account-list-name">Business 32 Day Notice Account</div>
              <div class="nl-account-list-label">Available balance</div>
            </div>
            <div class="nl-account-list-balance">R90.99</div>
          </a>
          <a href="Phone-accountDetails.html" class="nl-account-list-card" data-type="savings" data-name="flexible savings account">
            <span class="nl-account-accent"></span>
            <div class="nl-account-list-info">
              <div class="nl-account-list-name">Flexible Savings Account</div>
              <div class="nl-account-list-label">Available balance</div>
            </div>
            <div class="nl-account-list-balance">R0.00</div>
          </a>
        </div>
      </div>


      <div class="bottom-nav" id="bottomNav">
        <a href="Phone2.html" class="nav-item " id="Homee">
          <img src="../images/home.svg" alt="transact" style="filter: brightness(0) invert(50%) contrast(80%)" />
          <span>Home</span>
        </a>
        <a href="Phone%20accounts.html" class="nav-item active">
          <img src="../images/accounts.svg" alt="transact" style="filter: brightness(0) saturate(100%) invert(32%) sepia(89%) saturate(2087%) hue-rotate(202deg) brightness(95%) contrast(90%);"/>
          <span>Accounts</span>
        </a>
        <a href="Phone%20Transact.html" class="nav-item" id="transact">
          <img src="../images/transact.svg" alt="transact" style="filter: brightness(0) invert(50%) contrast(80%)"/>
          <span>Transact</span>
        </a>
        <a href="Phone-cards.html" class="nav-item" id="cards">
          <img src="../images/cards-action.svg" alt="transact" style="filter: brightness(0) invert(50%) contrast(80%)"/>
          <span>Cards</span>
        </a>
        <a href="Explore.html" class="nav-item">
          <span class="nav-icon material-icons-outlined">search</span>
          <span>Explore</span>
        </a>
      </div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div>
<script src="../scripts/chatbot.js"></script>
<script src="../scripts/App.js"></script>
<script src="../scripts/Automation.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        if (localStorage.getItem('previewNewLook') !== 'false') {
            document.body.classList.add('new-look-active');
        }

        var pills = document.querySelectorAll('.nl-pill');
        var cards = document.querySelectorAll('.nl-account-list-card');
        var searchInput = document.getElementById('nlAccountSearch');

        function applyFilters() {
            var activePill = document.querySelector('.nl-pill.active');
            var filter = activePill ? activePill.dataset.filter : 'all';
            var query = (searchInput && searchInput.value || '').toLowerCase().trim();
            cards.forEach(function (card) {
                var matchesFilter = filter === 'all' || card.dataset.type === filter;
                var matchesQuery = !query || card.dataset.name.indexOf(query) !== -1;
                card.style.display = (matchesFilter && matchesQuery) ? 'flex' : 'none';
            });
        }

        pills.forEach(function (pill) {
            pill.addEventListener('click', function () {
                pills.forEach(function (p) { p.classList.remove('active'); });
                pill.classList.add('active');
                applyFilters();
            });
        });

        if (searchInput) {
            searchInput.addEventListener('input', applyFilters);
        }
    });
</script>
</body>
</html>
