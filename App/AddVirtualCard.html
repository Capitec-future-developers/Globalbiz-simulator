<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Virtual Card</title>

    <link rel="stylesheet" href="../styles/MobileApp.css">
    <link rel="stylesheet" href="../styles/Phone-card.css">
    <link rel="stylesheet" href="../styles/AddCard-newlook.css">
    <link rel="stylesheet" href="../styles/Header.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../images/profile.jpg">
</head>

<body class="ma-body-root">
<div class="iphone">
    <div class="volume-buttons">
        <div class="volume-up"></div>
        <div class="volume-down"></div>
    </div>

    <div class="power-button"></div>

    <div class="screen" style="scroll-behavior: smooth">
        <div class="notch"></div>

        <div class="screen-content">
            <div class="ma-viewport ma-theme-white" id="maWizardRoot">
                <div class="ma-statusbar">
                    <span class="ma-statusbar-time">13:28</span>

                    <span class="ma-statusbar-icons">
                            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
                                <rect x="0" y="7" width="3" height="5" rx="1"/>
                                <rect x="5" y="4" width="3" height="8" rx="1"/>
                                <rect x="10" y="2" width="3" height="10" rx="1"/>
                                <rect x="15" y="0" width="3" height="12" rx="1"/>
                            </svg>

                            <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
                                <path
                                        d="M1 4a10 8 0 0 1 14 0M3.5 7a6 5 0 0 1 9 0M6 10a2.3 2 0 0 1 4 0"
                                        stroke="currentColor"
                                        stroke-width="1.4"
                                        stroke-linecap="round"
                                />
                            </svg>

                            <span class="ma-battery">
                                62
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/>
                                </svg>
                            </span>
                        </span>
                </div>

                <div class="ma-header">
                    <button
                            class="ma-header-back"
                            id="maBackBtn"
                            type="button"
                            aria-label="Back"
                    >
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path
                                    d="M15 5l-7 7 7 7"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                            />
                        </svg>
                    </button>

                    <span class="ma-header-title">Add New Card</span>
                </div>

                <div class="ma-progress-track">
                    <div
                            class="ma-progress-fill"
                            id="maProgressFill"
                            style="width: 20%;"
                    ></div>
                </div>

                <div class="ma-step-label" id="maStepLabel">
                    Step 1 of 5: <b>Card type</b>
                </div>

                <div class="ma-body" id="maStepBody"></div>

                <div class="ma-actions">
                    <button
                            class="ma-btn-primary"
                            id="maContinueBtn"
                            type="button"
                    >
                        Continue
                    </button>

                    <button
                            class="ma-btn-text"
                            id="maCancelBtn"
                            type="button"
                    >
                        Cancel
                    </button>
                </div>
            </div>

            <div class="bottom-nav" id="bottomNav">
                <a href="Phone2.html" class="nav-item" id="Homee">
                    <img
                            src="../images/home.svg"
                            alt="Home"
                            style="filter: brightness(0) invert(50%) contrast(80%);"
                    >
                    <span>Home</span>
                </a>

                <a href="Phone%20accounts.html" class="nav-item">
                    <img
                            src="../images/accounts.svg"
                            alt="Accounts"
                            style="filter: brightness(0) invert(50%) contrast(80%);"
                    >
                    <span>Accounts</span>
                </a>

                <a href="Phone%20Transact.html" class="nav-item" id="transact">
                    <img
                            src="../images/transact.svg"
                            alt="Transact"
                            style="filter: brightness(0) invert(50%) contrast(80%);"
                    >
                    <span>Transact</span>
                </a>

                <a href="Phone-cards.html" class="nav-item active" id="card">
                    <img
                            src="../images/cards-action.svg"
                            alt="Cards"
                            style="filter: brightness(0);"
                    >
                    <span>Cards</span>
                </a>

                <a href="Explore.html" class="nav-item">
                    <img src="../images/explore.png" class="nav-icon" style="width: 80%;">
                    <span>Explore</span>
                </a>
            </div>
        </div>
    </div>

    <div class="home-indicator"></div>
</div>

<script src="../scripts/MobileApp.js"></script>
<script src="../scripts/add-new-card.js"></script>
<script src="../scripts/CardsNewLook.js"></script>
<script src="../scripts/App.js"></script>
<script src="../scripts/Header.js"></script>
<script src="../scripts/Automation.js"></script>
<script src="../scripts/chatbot.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        if (localStorage.getItem("previewNewLook") !== "false") {
            document.body.classList.add("new-look-active");
        }

        const currentPage = decodeURIComponent(
            window.location.pathname.split("/").pop()
        ).toLowerCase();

        document.querySelectorAll(".bottom-nav .nav-item").forEach(function (item) {
            const link = item.getAttribute("href");

            if (
                link &&
                decodeURIComponent(link).split("/").pop().toLowerCase() === currentPage
            ) {
                item.classList.add("active");
            }
        });
    });
</script>
</body>
</html>
