<!-- =========================
     CARD DROPDOWN SCRIPT
========================== -->

<script>

    document.addEventListener("DOMContentLoaded", function () {

        const debitBtn =
            document.getElementById("debitToggle");

        const debitDropdown =
            document.getElementById("debit-dropdown");

        const virtualBtn =
            document.getElementById("virtualToggle");

        const virtualDropdown =
            document.getElementById("virtual-dropdown");


        /* Debit card */
        if (debitBtn && debitDropdown) {

            debitBtn.addEventListener("click", function (e) {

                e.preventDefault();

                debitDropdown.classList.toggle("show");

                if (virtualDropdown) {
                    virtualDropdown.classList.remove("show");
                }

            });

        }


        /* Virtual card */
        if (virtualBtn && virtualDropdown) {

            virtualBtn.addEventListener("click", function (e) {

                e.preventDefault();

                virtualDropdown.classList.toggle("show");

                if (debitDropdown) {
                    debitDropdown.classList.remove("show");
                }

            });

        }

    });

</script>
